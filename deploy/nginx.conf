worker_processes auto;
events { worker_connections 1024; }
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  client_max_body_size 1m;
  upstream api_up { server api:8000; }
  upstream web_up { server web:3000; }
  server {
    listen 80;
    # Always OVERWRITE forwarded headers so clients cannot spoof their IP (rate limits rely on it).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    location /api/auth/ { limit_req zone=auth burst=20 nodelay; proxy_pass http://api_up; }
    location /api/ { limit_req zone=api burst=60 nodelay; proxy_read_timeout 120s; proxy_pass http://api_up; }
    location / { proxy_pass http://web_up; }
  }
}
