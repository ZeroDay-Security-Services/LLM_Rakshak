# Production-style stack. MongoDB Atlas is the database (set LLMGUARD_MONGODB_URI in .env).
# For purely local development you may add the optional `local-mongo` profile:  docker compose --profile local-mongo up
services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]            # terminate TLS in front (load balancer / certbot) or mount certs and extend nginx.conf
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [web, api]
    restart: unless-stopped
  web:
    build: { context: ./frontend, args: { BACKEND_URL: "http://api:8000" } }
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    depends_on: [redis]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"], interval: 15s, timeout: 5s, retries: 5 }
  worker:
    build: ./backend
    env_file: .env
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info", "--concurrency=4"]
    depends_on: [redis]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
  local-mongo:
    profiles: ["local-mongo"]
    image: mongo:7
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
volumes: { mongo-data: {} }
